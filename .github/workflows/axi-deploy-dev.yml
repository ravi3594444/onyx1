name: Deploy 22nd X AI dev
# Deploys main to the development VM after the product checks pass on main.
# Policy: an automatic deploy deploys only what product/deploy/release.env pins at that commit
# (image digests, overlays, settings). It never changes the Onyx release: a new ONYX_RELEASE_TAG
# migrates the database, so it needs a manual run with allow_release_change. The VM takes a
# backup before a release change. On the multi-tenant stack (onyx-saas) deploy-remote.sh runs
# "vm-bootstrap.sh saas-update" of the deployed commit; its last line is
# RESULT=deployed|unchanged|rolled-back|failed and the summary shows it.
# See product/deploy/RUNBOOK.md, section 11, and docs/product/MULTI-TENANT.md, section 9.

on:
  workflow_dispatch:
    inputs:
      allow_release_change:
        description: Permit a new Onyx release (database migration). The VM takes a backup first.
        type: boolean
        default: false
  # Safe: the job runs only for a successful push run on main of this repository.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["22nd X AI product checks"]
    types: [completed]
    branches: [main]

# One deploy at a time. A queued deploy waits and is not cancelled.
# Shared VM lock with axi-bootstrap-dev.yml: one operation on the VM at a time.
concurrency:
  group: bootstrap-dev
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy to the development VM
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Wait for the VM lock (up to 20 minutes), image pull, health wait (15 minutes), backfill,
    # and a backup on a release change.
    timeout-minutes: 90
    environment: ci-protected
    permissions:
      contents: read
      # Reads the product check runs for a manual deploy.
      actions: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ALLOW_RELEASE_CHANGE: ${{ inputs.allow_release_change && '1' || '0' }}
    steps:
      - name: Check the deploy secrets
        id: secrets
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in DEV_SSH_HOST DEV_SSH_USER DEV_SSH_KEY DEV_SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || missing+=("${name}")
          done
          if ((${#missing[@]})); then
            echo "::notice::Deploy skipped. Missing secrets: ${missing[*]}."
            echo "Deploy skipped. Missing secrets: ${missing[*]}. See RUNBOOK.md, section 11." >>"${GITHUB_STEP_SUMMARY}"
            echo "ready=false" >>"${GITHUB_OUTPUT}"
          else
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          fi
      - name: Check that the product checks passed for this commit
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow axi-product-ci.yml \
            --branch main --commit "${DEPLOY_SHA}" --status success --json databaseId --jq length)"
          if ((passed == 0)); then
            echo "::error::The product checks did not pass on main for ${DEPLOY_SHA}. Run them on main first."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ || ! "${ALLOW_RELEASE_CHANGE}" =~ ^[01]$ ]]; then
            echo "::error::DEPLOY_SHA or ALLOW_RELEASE_CHANGE is not valid."
            exit 1
          fi
          ssh_dir="$(mktemp -d "${RUNNER_TEMP}/onyx-ssh.XXXXXX")"
          trap 'rm -rf "${ssh_dir}"' EXIT
          chmod 700 "${ssh_dir}"
          umask 077
          printf '%s\n' "${DEV_SSH_KEY}" >"${ssh_dir}/key"
          printf '%s\n' "${DEV_SSH_KNOWN_HOSTS}" >"${ssh_dir}/known_hosts"
          log="${RUNNER_TEMP}/deploy.log"
          # pipefail: the job fails when the script on the VM fails, not only when tee fails.
          ssh -F /dev/null -i "${ssh_dir}/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${ssh_dir}/known_hosts" \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            -l "${DEV_SSH_USER}" -- "${DEV_SSH_HOST}" \
            "ALLOW_RELEASE_CHANGE=${ALLOW_RELEASE_CHANGE} bash -s -- ${DEPLOY_SHA}" \
            <product/deploy/deploy-remote.sh 2>&1 | tee "${log}"
      - name: Write the summary
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          log="${RUNNER_TEMP}/deploy.log"
          result="$(sed -n -E 's/^RESULT=//p' "${log}" 2>/dev/null | tail -n 1)"
          {
            echo "## Deploy to the development VM"
            echo
            echo "Commit: \`${DEPLOY_SHA}\`. Release change allowed: ${ALLOW_RELEASE_CHANGE}."
            echo
            echo "RESULT=${result:-missing}"
            echo
            echo "The full log is in the artifact \`deploy-dev-log\`."
            echo
            echo '```'
            tail -n 40 "${log}" 2>/dev/null || echo "no log"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          if [[ -z "${result}" ]]; then
            echo "::warning::The deploy log has no RESULT line."
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.ready == 'true'
        with:
          name: deploy-dev-log
          path: ${{ runner.temp }}/deploy.log
          if-no-files-found: ignore
          retention-days: 30
