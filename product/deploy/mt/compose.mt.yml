# 22nd X AI multi-tenant TEST stack overlay for the Onyx v4.8.4 Docker Compose deployment.
# It is used together with compose.saas.yml, which holds the application settings.
# vm-bootstrap.sh mt-up copies both files into /srv/onyx-mt/deployment/docker_compose and runs:
#   docker compose -p onyx-mt -f docker-compose.yml -f compose.override.yml \
#     -f compose.saas.yml -f compose.mt.yml ...
# This file holds only what the TEST stack needs next to the live project "onyx": the
# project name, the memory limits, the smaller OpenSearch heap and the loopback port.
# Validation only. See README.md here.

# A different project name gives separate containers, networks and volumes (onyx-mt_*).
# vm-bootstrap.sh also gives -p onyx-mt and writes COMPOSE_PROJECT_NAME=onyx-mt into .env.
name: onyx-mt

services:
  api_server:
    deploy:
      resources:
        limits:
          memory: "${MT_API_SERVER_MEM_LIMIT:-2g}"

  background:
    environment:
      # Lower peak memory during indexing (upstream default: 6 threads).
      - CELERY_WORKER_DOCPROCESSING_CONCURRENCY=${MT_DOCPROCESSING_CONCURRENCY:-2}
    deploy:
      resources:
        limits:
          memory: "${MT_BACKGROUND_MEM_LIMIT:-4g}"

  web_server:
    deploy:
      resources:
        limits:
          memory: "${MT_WEB_SERVER_MEM_LIMIT:-1g}"

  inference_model_server:
    deploy:
      resources:
        limits:
          memory: "${MT_MODEL_SERVER_MEM_LIMIT:-3g}"

  indexing_model_server:
    deploy:
      resources:
        limits:
          memory: "${MT_MODEL_SERVER_MEM_LIMIT:-3g}"

  opensearch:
    environment:
      # Upstream fixes the heap at 2g in docker-compose.yml. Compose merges environment by
      # key, so this value replaces it. Keep Xms equal to Xmx.
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    deploy:
      resources:
        limits:
          memory: "${MT_OPENSEARCH_MEM_LIMIT:-2g}"

  relational_db:
    deploy:
      resources:
        limits:
          memory: "${MT_RELATIONAL_DB_MEM_LIMIT:-2g}"

  nginx:
    # Only on the loopback interface, port 3200. The live stack keeps 80, 443 and 3000.
    ports: !override
      - "127.0.0.1:3200:80"
