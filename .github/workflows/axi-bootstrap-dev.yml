name: Bootstrap dev VM
# Runs product/deploy/vm-bootstrap.sh on the development VM over SSH.
# inspect: read-only report. install: Docker, host settings, release files, stack start.
# verify: functional checks, backup, isolated restore. restart: down and up, then search
# and privacy checks. https, https-staging: Let's Encrypt for my-knowledge.duckdns.org.
# owner: admin access, invitation, invite-only sign-up. model: hosted LLM provider.
# smtp: mail settings. The model and smtp actions read environment secrets.
# mt-*: a separate multi-tenant validation stack (project onyx-mt, 127.0.0.1:3200).
# mt-down keeps its volumes; mt-destroy removes them. See product/deploy/mt/README.md.
# inventory, cutover, rollback, saas-*: the production multi-tenant stack (project onyx-saas)
# on the public URL. cutover moves the owner_email account and the other real accounts.
# saas-journey: customer-journey test; saas-defaults: platform defaults for every company;
# saas-update: deploy a commit on onyx-saas; saas-update-release-change also permits a new
# Onyx release (the VM takes a backup first). ci-host-setup: the Code Interpreter executor
# on the host with a rootless daemon; ci-host-setup-main-socket uses the main Docker socket.
# saas-tools-check: Code Interpreter and Web Search acceptance test. saas-rotate-key-dry-run,
# then saas-rotate-key: platform key rotation. saas-backup: cold backup of onyx-saas.
# saas-restore-test: restore the newest backup, or backup_path, into an isolated copy.
# See docs/product/MULTI-TENANT.md, sections 6-11.
# assistant-prompt (show), assistant-prompt-set, assistant-prompt-reset, chat-check: default
# assistant prompt and chat checks on the live stack. See product/deploy/RUNBOOK.md.
# GitHub allows 10 inputs for workflow_dispatch: a mode is part of the action name.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action on the VM
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - install
          - verify
          - verify-with-chat
          - restart
          - https
          - https-staging
          - owner
          - model
          - smtp
          - keygen
          - mt-up
          - mt-check
          - mt-check-after-restart
          - mt-restart
          - mt-down
          - mt-destroy
          - inventory
          - cutover
          - rollback
          - saas-check
          - saas-check-after-restart
          - saas-restart
          - saas-journey
          - saas-journey-after-restart
          - saas-defaults
          - saas-defaults-dry-run
          - saas-update
          - saas-update-release-change
          - saas-down
          - ci-host-setup
          - ci-host-setup-main-socket
          - saas-tools-check
          - saas-rotate-key-dry-run
          - saas-rotate-key
          - saas-backup
          - saas-restore-test
          - assistant-prompt
          - assistant-prompt-set
          - assistant-prompt-reset
          - chat-check
      backup_path:
        description: Backup folder under /srv/backups to restore (saas-restore-test only; empty = newest)
        type: string
        default: ""
      web_domain:
        description: Public URL of the stack (install only, for a new .env)
        type: string
        default: http://my-knowledge.duckdns.org
      letsencrypt_email:
        description: Email for the Let's Encrypt account (https, https-staging and cutover only)
        type: string
        default: ""
      owner_email:
        description: Workspace owner (owner, inventory and cutover)
        type: string
        default: ravi80847949@gmail.com
      invite_email:
        description: One member to invite (owner only, optional)
        type: string
        default: ""
      invite_only:
        description: Invite-only sign-up (owner only)
        type: choice
        default: keep
        options: [keep, "on", "off"]
      model_provider:
        description: LiteLLM provider name (model only)
        type: string
        default: fireworks_ai
      model_name:
        description: Model id, or list to show the provider's matching models (model only)
        type: string
        default: list
      sealed_model_key:
        description: Model key encrypted to the VM inbox key (base64; model only, when the secret MODEL_API_KEY is not set)
        type: string
        default: ""

permissions:
  contents: read

# One VM operation at a time. A queued run waits and is not cancelled.
concurrency:
  group: bootstrap-dev
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    name: ${{ inputs.action }} on the development VM
    if: github.ref == 'refs/heads/main' && github.repository == 'ravi3594444/onyx1'
    runs-on: ubuntu-latest
    # verify: checks, backup, restore and two health waits of up to 15 minutes each.
    timeout-minutes: 90
    environment: ci-protected
    permissions:
      contents: read
    env:
      BOOTSTRAP_ACTION: ${{ inputs.action }}
      WEB_DOMAIN: ${{ inputs.web_domain }}
      LETSENCRYPT_EMAIL: ${{ inputs.letsencrypt_email }}
      OWNER_EMAIL: ${{ inputs.owner_email }}
      INVITE_EMAIL: ${{ inputs.invite_email }}
      INVITE_ONLY: ${{ inputs.invite_only }}
      MODEL_PROVIDER: ${{ inputs.model_provider }}
      MODEL_NAME: ${{ inputs.model_name }}
      SEALED_MODEL_KEY: ${{ inputs.sealed_model_key }}
      BACKUP_PATH: ${{ inputs.backup_path }}
    steps:
      - name: Check the deploy secrets
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEV_SSH_HOST DEV_SSH_USER DEV_SSH_KEY DEV_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret ${name} in ci-protected. See RUNBOOK.md, section 11."
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Send the secrets file to the VM
        if: inputs.action == 'model' || inputs.action == 'smtp'
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_BASE: ${{ secrets.MODEL_API_BASE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          # %q writes bash quoting, because vm-bootstrap.sh sources the file. The values never
          # reach the command line or the log.
          case "${BOOTSTRAP_ACTION}" in
            model)
              if [[ -n "${MODEL_API_KEY}" ]]; then
                name=model.env
                content="$(printf 'MODEL_API_KEY=%q\nMODEL_API_BASE=%q\n' "${MODEL_API_KEY}" "${MODEL_API_BASE}")"
              elif [[ "${SEALED_MODEL_KEY}" =~ ^[A-Za-z0-9+/=]+$ ]]; then
                # Ciphertext for the VM inbox key; only the VM can decrypt it.
                name=model.sealed
                content="${SEALED_MODEL_KEY}"
              else
                echo "::error::Add the secret MODEL_API_KEY to ci-protected, or pass sealed_model_key."
                exit 1
              fi
              ;;
            smtp)
              if [[ -z "${SMTP_SERVER}" || -z "${EMAIL_FROM}" ]]; then
                echo "::error::Add the secrets SMTP_SERVER, SMTP_PORT, SMTP_USER, SMTP_PASS and EMAIL_FROM to ci-protected."
                exit 1
              fi
              name=smtp.env
              content="$(printf 'SMTP_SERVER=%q\nSMTP_PORT=%q\nSMTP_USER=%q\nSMTP_PASS=%q\nSMTP_STARTTLS=%q\nEMAIL_FROM=%q\n'                 "${SMTP_SERVER}" "${SMTP_PORT}" "${SMTP_USER}" "${SMTP_PASS}" "${SMTP_STARTTLS}" "${EMAIL_FROM}")"
              ;;
          esac
          ssh_dir="$(mktemp -d "${RUNNER_TEMP}/onyx-ssh.XXXXXX")"
          trap 'rm -rf "${ssh_dir}"' EXIT
          chmod 700 "${ssh_dir}"
          umask 077
          printf '%s\n' "${DEV_SSH_KEY}" >"${ssh_dir}/key"
          printf '%s\n' "${DEV_SSH_KNOWN_HOSTS}" >"${ssh_dir}/known_hosts"
          printf '%s\n' "${content}" | ssh -F /dev/null -i "${ssh_dir}/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${ssh_dir}/known_hosts" \
            -o ConnectTimeout=30 \
            -l "${DEV_SSH_USER}" -- "${DEV_SSH_HOST}" \
            "umask 077 && mkdir -p /srv/onyx/secrets && cat >/srv/onyx/secrets/${name}"
          echo "Wrote /srv/onyx/secrets/${name} on the VM."
      - name: Run vm-bootstrap.sh over SSH
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          case "${BOOTSTRAP_ACTION}" in
            inspect) args="inspect" ;;
            install) args="install ${GITHUB_SHA} ${WEB_DOMAIN}" ;;
            verify) args="verify ${GITHUB_SHA}" ;;
            verify-with-chat) args="verify ${GITHUB_SHA} with-chat" ;;
            restart) args="restart ${GITHUB_SHA}" ;;
            https | https-staging)
              # The value goes into the remote command line, so allow only a plain address.
              if [[ ! "${LETSENCRYPT_EMAIL}" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
                echo "::error::Give letsencrypt_email for the ${BOOTSTRAP_ACTION} action."
                exit 1
              fi
              args="https ${GITHUB_SHA} ${LETSENCRYPT_EMAIL}"
              [[ "${BOOTSTRAP_ACTION}" == https-staging ]] && args+=" staging"
              ;;
            owner)
              email_re='^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
              if [[ ! "${OWNER_EMAIL}" =~ ${email_re} ]]; then
                echo "::error::owner_email is not a plain email address."; exit 1
              fi
              if [[ -n "${INVITE_EMAIL}" && ! "${INVITE_EMAIL}" =~ ${email_re} ]]; then
                echo "::error::invite_email is not a plain email address."; exit 1
              fi
              args="owner ${GITHUB_SHA} ${OWNER_EMAIL} ${INVITE_EMAIL:--} ${INVITE_ONLY}"
              ;;
            model)
              if [[ ! "${MODEL_PROVIDER}" =~ ^[a-z0-9_]+$ || ! "${MODEL_NAME}" =~ ^[A-Za-z0-9._/:-]+$ ]]; then
                echo "::error::model_provider or model_name has characters that are not allowed."; exit 1
              fi
              args="model ${GITHUB_SHA} ${MODEL_PROVIDER} ${MODEL_NAME}"
              ;;
            smtp) args="smtp ${GITHUB_SHA}" ;;
            keygen) args="keygen" ;;
            mt-up) args="mt-up ${GITHUB_SHA}" ;;
            mt-check) args="mt-check ${GITHUB_SHA}" ;;
            mt-check-after-restart) args="mt-check ${GITHUB_SHA} after-restart" ;;
            mt-restart) args="mt-restart ${GITHUB_SHA}" ;;
            mt-down) args="mt-down" ;;
            mt-destroy) args="mt-destroy" ;;
            inventory | cutover)
              # The values go into the remote command line, so allow only plain addresses.
              email_re='^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
              if [[ ! "${OWNER_EMAIL}" =~ ${email_re} ]]; then
                echo "::error::owner_email is not a plain email address."; exit 1
              fi
              if [[ "${BOOTSTRAP_ACTION}" == inventory ]]; then
                args="inventory ${GITHUB_SHA} ${OWNER_EMAIL}"
              elif [[ ! "${LETSENCRYPT_EMAIL}" =~ ${email_re} ]]; then
                echo "::error::Give letsencrypt_email for the cutover action."; exit 1
              else
                args="cutover ${GITHUB_SHA} ${LETSENCRYPT_EMAIL} ${OWNER_EMAIL}"
              fi
              ;;
            rollback) args="rollback ${GITHUB_SHA}" ;;
            saas-check) args="saas-check ${GITHUB_SHA}" ;;
            saas-check-after-restart) args="saas-check ${GITHUB_SHA} after-restart" ;;
            saas-restart) args="saas-restart ${GITHUB_SHA}" ;;
            saas-journey) args="saas-journey ${GITHUB_SHA}" ;;
            saas-journey-after-restart) args="saas-journey ${GITHUB_SHA} after-restart" ;;
            saas-defaults) args="saas-defaults ${GITHUB_SHA}" ;;
            saas-defaults-dry-run) args="saas-defaults ${GITHUB_SHA} dry-run" ;;
            saas-update) args="saas-update ${GITHUB_SHA}" ;;
            saas-update-release-change) args="saas-update ${GITHUB_SHA} release-change" ;;
            saas-down) args="saas-down ${GITHUB_SHA}" ;;
            ci-host-setup) args="ci-host-setup ${GITHUB_SHA}" ;;
            ci-host-setup-main-socket) args="ci-host-setup ${GITHUB_SHA} main-socket" ;;
            saas-tools-check) args="saas-tools-check ${GITHUB_SHA}" ;;
            saas-rotate-key-dry-run) args="saas-rotate-key ${GITHUB_SHA} dry-run" ;;
            saas-rotate-key) args="saas-rotate-key ${GITHUB_SHA}" ;;
            saas-backup) args="saas-backup ${GITHUB_SHA}" ;;
            saas-restore-test)
              args="saas-restore-test ${GITHUB_SHA}"
              if [[ -n "${BACKUP_PATH}" ]]; then
                # The value goes into the remote command line, so allow one plain folder name.
                if [[ ! "${BACKUP_PATH}" =~ ^/srv/backups/[A-Za-z0-9_.-]+$ ]]; then
                  echo "::error::backup_path must match ^/srv/backups/[A-Za-z0-9_.-]+$."; exit 1
                fi
                args+=" ${BACKUP_PATH}"
              fi
              ;;
            assistant-prompt) args="assistant-prompt ${GITHUB_SHA} show" ;;
            assistant-prompt-set) args="assistant-prompt ${GITHUB_SHA} set" ;;
            assistant-prompt-reset) args="assistant-prompt ${GITHUB_SHA} reset" ;;
            chat-check) args="chat-check ${GITHUB_SHA}" ;;
            *) echo "::error::Unknown action ${BOOTSTRAP_ACTION}."; exit 1 ;;
          esac
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ || ! "${WEB_DOMAIN}" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::GITHUB_SHA or web_domain is not valid."
            exit 1
          fi
          ssh_dir="$(mktemp -d "${RUNNER_TEMP}/onyx-ssh.XXXXXX")"
          trap 'rm -rf "${ssh_dir}"' EXIT
          chmod 700 "${ssh_dir}"
          umask 077
          printf '%s\n' "${DEV_SSH_KEY}" >"${ssh_dir}/key"
          printf '%s\n' "${DEV_SSH_KNOWN_HOSTS}" >"${ssh_dir}/known_hosts"
          log="${RUNNER_TEMP}/bootstrap-${BOOTSTRAP_ACTION}.log"
          # pipefail: the job fails when the script on the VM fails, not only when tee fails.
          ssh -F /dev/null -i "${ssh_dir}/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${ssh_dir}/known_hosts" \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            -l "${DEV_SSH_USER}" -- "${DEV_SSH_HOST}" \
            "bash -s -- ${args}" <product/deploy/vm-bootstrap.sh 2>&1 | tee "${log}"
          {
            echo "## Bootstrap dev VM: ${BOOTSTRAP_ACTION}"
            echo
            echo "Commit: \`${GITHUB_SHA}\`. The full log is in the artifact \`bootstrap-${BOOTSTRAP_ACTION}-log\`."
            echo
            echo '```'
            tail -n 40 "${log}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Write the summary after a failure
        if: failure()
        run: |
          log="${RUNNER_TEMP}/bootstrap-${BOOTSTRAP_ACTION}.log"
          {
            echo "## Bootstrap dev VM: ${BOOTSTRAP_ACTION} failed"
            echo
            echo "Commit: \`${GITHUB_SHA}\`. See the artifact \`bootstrap-${BOOTSTRAP_ACTION}-log\`."
            echo
            echo '```'
            tail -n 60 "${log}" 2>/dev/null || echo "no log"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-${{ inputs.action }}-log
          path: ${{ runner.temp }}/bootstrap-*.log
          if-no-files-found: ignore
          retention-days: 30
