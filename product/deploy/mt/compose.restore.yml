# 22nd X AI restore-test overlay for a copy of the PRODUCTION multi-tenant stack.
# vm-bootstrap.sh saas-restore-test restores the newest *-saas backup into
# /srv/onyx-saas-restore and runs it as project onyx-saas-restore with:
#   COMPOSE_FILE=docker-compose.yml:compose.override.yml:compose.saas.yml:compose.restore.yml
#   COMPOSE_PROFILES=s3-filestore
# The copy answers on 127.0.0.1:3300 only, sends no email, calls no platform model and has
# no tools: the services below with the profile "restore-disabled" (background,
# indexing_model_server, code-interpreter) are never created. restore.sh starts nginx and
# the services that it needs. restore.sh pins COMPOSE_PROJECT_NAME, COMPOSE_FILE and
# COMPOSE_PROFILES into the restored .env, so a plain "docker compose" in the restore folder
# addresses the copy, never onyx-saas.
# The memory limits are the ones of compose.mt.yml. The restore test needs 5 GiB free.

# For reading; the -p of vm-bootstrap.sh and COMPOSE_PROJECT_NAME in .env win.
name: onyx-saas-restore

services:
  api_server:
    environment:
      # No email from the copy.
      - SMTP_SERVER=
      - SMTP_USER=
      - SMTP_PASS=
      - EMAIL_FROM=
      - SENDGRID_API_KEY=
      - ENABLE_EMAIL_INVITES=false
      # No platform defaults for new companies on the copy.
      - FIREWORKS_DEFAULT_API_KEY=
      - WEB_SEARCH_DEFAULT_PROVIDER=
      - WEB_SEARCH_DEFAULT_API_KEY=
      - WEB_SEARCH_DEFAULT_CONFIG=
    deploy:
      resources:
        limits:
          memory: "${MT_API_SERVER_MEM_LIMIT:-2g}"

  background:
    # Not created: it runs the connector syncs and the bots with the restored credentials.
    profiles: ["restore-disabled"]
    environment:
      - SMTP_SERVER=
      - SMTP_USER=
      - SMTP_PASS=
      - EMAIL_FROM=
      - SENDGRID_API_KEY=
      - ENABLE_EMAIL_INVITES=false
      - FIREWORKS_DEFAULT_API_KEY=
      - WEB_SEARCH_DEFAULT_PROVIDER=
      - WEB_SEARCH_DEFAULT_API_KEY=
      - WEB_SEARCH_DEFAULT_CONFIG=
      - CELERY_WORKER_DOCPROCESSING_CONCURRENCY=${MT_DOCPROCESSING_CONCURRENCY:-2}
    deploy:
      resources:
        limits:
          memory: "${MT_BACKGROUND_MEM_LIMIT:-4g}"

  web_server:
    deploy:
      resources:
        limits:
          memory: "${MT_WEB_SERVER_MEM_LIMIT:-1g}"

  inference_model_server:
    deploy:
      resources:
        limits:
          memory: "${MT_MODEL_SERVER_MEM_LIMIT:-3g}"

  indexing_model_server:
    # Not created: nothing indexes on the copy.
    profiles: ["restore-disabled"]
    deploy:
      resources:
        limits:
          memory: "${MT_MODEL_SERVER_MEM_LIMIT:-3g}"

  opensearch:
    environment:
      # Upstream fixes the heap at 2g. Compose merges environment by key.
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    deploy:
      resources:
        limits:
          memory: "${MT_OPENSEARCH_MEM_LIMIT:-2g}"

  relational_db:
    deploy:
      resources:
        limits:
          memory: "${MT_RELATIONAL_DB_MEM_LIMIT:-2g}"

  nginx:
    # Loopback only. The production stack keeps 80 and 443.
    ports: !override
      - "127.0.0.1:3300:80"

  # compose.tools.yml is not in the file list of the copy, so ci-gateway and searxng do
  # not exist there. The upstream code-interpreter service does. Compose appends profile
  # lists, so !override replaces the profile "code-interpreter" of compose.override.yml:
  # the service stays off even when COMPOSE_PROFILES names "code-interpreter".
  code-interpreter:
    profiles: !override ["restore-disabled"]
