# ci-gateway: the only path from the Onyx services to the code interpreter API (0.4.7).
# vm-bootstrap.sh saas_prepare copies this file to deployment/docker_compose/tools/ and
# compose.tools.yml mounts it as /etc/nginx/conf.d/default.conf of the ci-gateway service.
#
# The code interpreter API has no authentication and one global file store. It is only on
# the internal network ci_internal; api_server reaches it through this gateway
# (CODE_INTERPRETER_BASE_URL=http://ci-gateway:8000). The gateway passes only the calls
# that the Onyx tools make and answers 403 to everything else, in particular to:
#   GET /v1/files            lists the staged files of every company
#   /v1/sessions/*           long-lived executor containers with bash access
#   /docs, /openapi.json     the API description
# The regex of /v1/files/<id> accepts only a UUID, so a path in file_id goes nowhere.

server {
    listen 8000;
    server_name _;

    # The Docker DNS. A variable upstream makes nginx start even while the code
    # interpreter is down, and look the name up again after a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ci_upstream http://code-interpreter:8000;

    # MAX_FILE_SIZE_MB=100 in compose.tools.yml, plus the multipart envelope.
    client_max_body_size 110m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    # MAX_EXEC_TIMEOUT_MS=60000: one run takes at most 60 s plus the container start.
    proxy_read_timeout 120s;

    error_page 403 = @forbidden;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass $ci_upstream;
    }

    location = /v1/execute {
        limit_except POST { deny all; }
        proxy_buffering off;
        proxy_pass $ci_upstream;
    }

    location = /v1/execute/stream {
        limit_except POST { deny all; }
        proxy_buffering off;
        proxy_pass $ci_upstream;
    }

    # Upload only. GET /v1/files (the listing) gets 403 from limit_except.
    location = /v1/files {
        limit_except POST { deny all; }
        proxy_pass $ci_upstream;
    }

    location ~ "^/v1/files/[0-9a-f-]{36}$" {
        limit_except GET DELETE { deny all; }
        proxy_pass $ci_upstream;
    }

    location / {
        return 403;
    }

    location @forbidden {
        default_type application/json;
        return 403 '{"detail":"forbidden by ci-gateway"}';
    }
}
