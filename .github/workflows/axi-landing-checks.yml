name: 22nd X AI landing checks

on:
  pull_request:
    paths:
      - "product/landing/**"
      - ".github/workflows/axi-landing-checks.yml"
  push:
    branches: [main]
    paths:
      - "product/landing/**"
      - ".github/workflows/axi-landing-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the static landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: product/landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: product/landing/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and build for the existing application origin
        env:
          VITE_APP_URL: https://my-knowledge.duckdns.org
          VITE_LANDING_BASE_PATH: /_landing/
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v4
        with:
          name: axi-landing-dist
          path: product/landing/dist/
          if-no-files-found: error
          retention-days: 14
