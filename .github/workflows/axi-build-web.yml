name: Build 22nd X AI web image
# Builds the Onyx web image at the pinned upstream tag with product/branding/web-overlay
# applied, then pushes it to GHCR. Deploy the printed digest through
# ONYX_WEB_SERVER_IMAGE in product/deploy/release.env.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "product/branding/web-overlay/**"
      - "product/branding/build-web-image.sh"
      - ".github/workflows/axi-build-web.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/ravi3594444/onyx1/onyx-web-server

jobs:
  build:
    name: Build and push the web image
    if: github.repository == 'ravi3594444/onyx1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [single, cloud]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fetch the upstream release tag
        run: |
          tag="$(sed -n 's/^ONYX_RELEASE_TAG=//p' product/deploy/release.env)"
          git fetch --no-tags --depth=1 https://github.com/onyx-dot-app/onyx \
            "refs/tags/${tag}:refs/tags/${tag}"
          echo "ONYX_RELEASE_TAG=${tag}" >>"${GITHUB_ENV}"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # ratchet:docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # single: the live single-tenant stack. cloud: NEXT_PUBLIC_CLOUD_ENABLED=true for the
      # multi-tenant stack (a build-time value, so two images).
      - name: Build the image
        env:
          RUN_NUMBER: ${{ github.run_number }}
          VARIANT: ${{ matrix.variant }}
        run: |
          suffix=""
          cloud_flag=()
          if [[ "${VARIANT}" == cloud ]]; then suffix="-cloud"; cloud_flag=(--cloud); fi
          echo "SUFFIX=${suffix}" >>"${GITHUB_ENV}"
          product/branding/build-web-image.sh "${cloud_flag[@]}" \
            --tag "${IMAGE}:${ONYX_RELEASE_TAG}-axi${suffix}.${RUN_NUMBER}" \
            --tag "${IMAGE}:${GITHUB_SHA}${suffix}" | tee "${RUNNER_TEMP}/build.log"
      - name: Push the image
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          docker push "${IMAGE}:${ONYX_RELEASE_TAG}-axi${SUFFIX}.${RUN_NUMBER}"
          docker push "${IMAGE}:${GITHUB_SHA}${SUFFIX}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}${SUFFIX}")"
          digest="${digest#*@}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No digest for the pushed image."
            exit 1
          fi
          echo "${digest}" >"${RUNNER_TEMP}/image-digest${SUFFIX}.txt"
          var=ONYX_WEB_SERVER_IMAGE
          [[ -z "${SUFFIX}" ]] || var=ONYX_WEB_SERVER_IMAGE_MT
          {
            echo "## Web image ${ONYX_RELEASE_TAG}-axi${SUFFIX}.${RUN_NUMBER}"
            echo
            echo "Digest: \`${digest}\`"
            echo
            echo "Tags: \`${IMAGE}:${ONYX_RELEASE_TAG}-axi${SUFFIX}.${RUN_NUMBER}\`, \`${IMAGE}:${GITHUB_SHA}${SUFFIX}\`"
            echo
            echo "Deploy: set in product/deploy/release.env"
            echo
            echo '```'
            echo "${var}=${IMAGE}:${ONYX_RELEASE_TAG}-axi${SUFFIX}.${RUN_NUMBER}@${digest}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.variant }}
          path: ${{ runner.temp }}/image-digest*.txt
          retention-days: 90
